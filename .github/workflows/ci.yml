name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          # Real production domain (Vercel) — see DEPLOYMENT.md. Using it
          # here too so a CI build exercises the same absolute-URL values
          # production actually gets, not an arbitrary placeholder.
          NEXT_PUBLIC_SITE_URL: https://moraltree.media
